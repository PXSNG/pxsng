services:
  frontend:
    build:
      context: ../frontend
    ports:
      - '8080:8080'
    expose:
      - '8080'
    depends_on:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:8080/ || exit 1']
      interval: 10s
      retries: 5
  backend:
    build:
      context: ../backend
    env_file:
      - .env
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    expose:
      - '3000'
    depends_on:
      - oracle-db
    command: sh -c "flutter pub get && flutter test"

  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: free-oracle-db
    restart: unless-stopped
    hostname: database
    env_file:
      - .env
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    expose:
      - '1521'
      - '5500'
    volumes:
      - ../model/oracle-data/data/:/opt/oracle/oradata
      - ../model/oracle-data/startup/:/opt/oracle/scripts/startup
      - ../model/oracle-data/setup/:/opt/oracle/scripts/setup
    healthcheck:
      test: ['CMD-SHELL', "lsnrctl status | grep 'READY'"]
      interval: 10s
      retries: 10

