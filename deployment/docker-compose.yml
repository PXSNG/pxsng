services:
  frontend:
    build:
      context: ../frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped
    hostname: frontend
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://localhost:80/index.html || exit 1',
        ]
      interval: 20s
      retries: 5
  backend:
    build:
      context: ../backend
    env_file:
      - .env
    expose:
      - '8080'
    restart: unless-stopped
    hostname: backend
    depends_on:
      - oracle-db
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: free-oracle-db
    restart: unless-stopped
    hostname: database
    env_file:
      - .env
    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    expose:
      - '1521'
      - '5500'
    volumes:
      - ../model/oracle-data/data/:/opt/oracle/oradata
      - ../model/oracle-data/startup/:/opt/oracle/scripts/startup
      - ../model/oracle-data/setup/:/opt/oracle/scripts/setup
    healthcheck:
      test: ['CMD-SHELL', "lsnrctl status | grep 'READY'"]
      interval: 20s
      retries: 10

